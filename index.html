<!DOCTYPE html>
<html>
<head>
    <title>Pokemon Rojo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        #start-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 45px;
            font-size: 22px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            background: #d32f2f;
            color: white;
            border: 3px solid #fff;
            border-radius: 12px;
            z-index: 9999;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            animation: pulse 1.5s infinite;
        }
        #start-btn:active {
            background: #b71c1c;
            transform: translate(-50%, -50%) scale(0.95);
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
            50% { box-shadow: 0 0 35px rgba(255, 0, 0, 1); }
        }
    </style>
</head>
<body>
    <button id="start-btn" onclick="startGame()">▶ JUGAR</button>
    <div id="game" style="display:none;"></div>

    <script>
        function startGame() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('game').style.display = 'block';

            window.EJS_player = "#game";
            window.EJS_gameUrl = "rojo.gbc";
            window.EJS_core = "gambatte";
            window.EJS_gameName = "Pokemon Rojo";
            window.EJS_pathtodata = "data/";
            window.EJS_startOnLoaded = true;
           

            var script = document.createElement('script');
            script.src = "data/loader.js";
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
